name: Testes

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_k6:
        description: 'Executar também o smoke de performance (k6)'
        type: boolean
        default: false

env:
  BASE_URL: https://english.qazando.com.br
  TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
  TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

jobs:
  playwright:
    name: Playwright (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes
        run: npx playwright test

      - name: Publicar relatório HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar resultados (JSON/JUnit, traces, vídeos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  k6-smoke:
    name: k6 (smoke)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_k6 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - uses: grafana/setup-k6-action@v1

      - name: Executar smoke
        run: npm run test:perf:smoke

      - name: Publicar relatórios k6
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: k6-reports
          path: reports/k6/
          retention-days: 14
